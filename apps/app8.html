<html lang="fr">
<head>
  <meta charset="UTF-8">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Modules utilisés par le code Gizmo -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "react-dom": "https://esm.sh/react-dom@18.3.1?external=react",

<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module" data-presets="gizmo-tsx">
// ===== CODE GIZMO ORIGINAL (non modifié) =====
import React, { useEffect, useRef, useState, useCallback } from 'react';
import Matter from 'matter-js';
import * as Tone from 'tone';
import { gizmoRuntime } from '@gizmo/runtime';
import { Grab, Hammer, Zap, Bomb, RotateCcw, Play, Pause, Hand, ShoppingCart, X, Rocket, Axe, Snowflake, Fence, Paintbrush, UserPlus, Images, CircleDot, Weight, Star, Crosshair, ShieldAlert, Shirt } from 'lucide-react';

// --- Tweaks ---
const tweaks = gizmoRuntime.tweaks({
  gravityScale: { index: 0, name: 'Gravity', type: 'slider', value: 1.3000001, min: 0, max: 3, step: 0.1 },
  stiffness: { index: 1, name: 'Joint Stiffness', type: 'slider', value: 0.9, min: 0.1, max: 1, step: 0.1 },
  slowMoFactor: { index: 2, name: 'Slow Mo Speed', type: 'slider', value: 0.2, min: 0.05, max: 0.5, step: 0.05 },
  particleCount: { index: 3, name: 'Particles', type: 'slider', value: 20, min: 5, max: 50, step: 1 },
  wallColor: { index: 4, name: 'Wall Color', type: 'color', value: '#333333' },
  ragdollColor: { index: 5, name: 'Ragdoll Color', type: 'color', value: "#FFD300" },
  goliathSize: { index: 6, name: 'Goliath Scale', type: 'slider', value: 2.5, min: 1.5, max: 4, step: 0.1 },
  performanceMode: { index: 7, name: 'Performance Mode', type: 'toggle', value: false },
  maxBodies: { index: 8, name: 'Max Bodies', type: 'slider', value: 50, min: 10, max: 100, step: 10 },
  constraintIterations: { index: 9, name: 'Physics Quality', type: 'slider', value: 2, min: 1, max: 4, step: 1 },
});

// --- Constants ---
const CATEGORY_RAGDOLL = 0x0001;
const CATEGORY_WALL = 0x0002;
const CATEGORY_PROP = 0x0004;
const CATEGORY_ENEMY = 0x0008;

const ALL_TOOLS = [
  { id: 'slap', name: 'Slap', icon: Hand, color: '#EFB63F', price: 0 },
  { id: 'hand', name: 'Drag', icon: Grab, color: '#53B5F9', price: 0 },
  { id: 'spawnEnemy', name: 'Spawn Enemy', icon: UserPlus, color: '#8762F6', price: 0 },
  { id: 'spawnGoliath', name: 'Spawn Goliath', icon: ShieldAlert, color: '#E93323', price: 0 },
  { id: 'hammer', name: 'Hammer', icon: Hammer, color: '#E93323', price: 5000 },
  { id: 'electrocute', name: 'Electrocute', icon: Zap, color: '#75F94C', price: 15000 },
  { id: 'bomb', name: 'Bomb', icon: Bomb, color: '#E432B7', price: 25000 },
  { id: 'freezeRay', name: 'Freeze Ray', icon: Snowflake, color: '#00BFFF', price: 60000 },
  { id: 'spikeTrap', name: 'Spike Trap', icon: Fence, color: '#808080', price: 35000 },
  { id: 'paintGun', name: 'Paint Gun', icon: Paintbrush, color: '#FF69B4', price: 20000 },
  { id: 'thorHammer', name: 'Mjolnir', icon: Hammer, color: '#4682B4', price: 85000 },
  { id: 'shuriken', name: 'Dumbbell', icon: Weight, color: '#696969', price: 40000 },
  { id: 'rocketLauncher', name: 'Rocket Launcher', icon: Rocket, color: '#FF4500', price: 50000 },
];

const RAGDOLL_SKINS = [
  { id: 'default', name: 'Classic Yellow', color: '#FFD300', headColor: '#FFDD46', face: '🫩', price: 0 },
  { id: 'zombie', name: 'Zombie', color: '#4A5D23', headColor: '#7A9D54', face: '🤢', price: 10000 },
  { id: 'alien', name: 'Alien', color: '#228B22', headColor: '#32CD32', face: '👽', price: 25000 },
  { id: 'ghost', name: 'Ghost', color: '#F8F8FF', headColor: '#FFFFFF', face: '💀', price: 50000 },
  { id: 'lava', name: 'Lava', color: '#8B0000', headColor: '#FF4500', face: '🔥', price: 75000 },
  { id: 'gold', name: 'Solid Gold', color: '#FFD700', headColor: '#DAA520', face: '🤴', price: 150000 },
  { id: 'shadow', name: 'Shadow', color: '#1A1A1A', headColor: '#000000', face: '🌚', price: 100000 },
  { id: 'frozen', name: 'Frozen', color: '#B0E0E6', headColor: '#E0FFFF', face: '🥶', price: 30000 },
  { id: 'royal', name: 'Royal Purple', color: '#4B0082', headColor: '#8A2BE2', face: '👿', price: 60000 },
];

// --- Helper Functions ---
const randomRange = (min, max) => Math.random() * (max - min) + min;

export default function RagdollSmashLab() {
  // --- Refs & State ---
  const sceneRef = useRef(null);
  const engineRef = useRef(null);
  const runnerRef = useRef(null);
  const renderLoopRef = useRef(null);
  const canvasRef = useRef(null);
  
  // Game State
  const [selectedTool, setSelectedTool] = useState('slap');
  const [isPaused, setIsPaused] = useState(false);
  const [isSlowMo, setIsSlowMo] = useState(false);
  const [money, setMoney] = useState(0);
  const [isShopOpen, setIsShopOpen] = useState(false);
  const [isSkinShopOpen, setIsSkinShopOpen] = useState(false);
  const [currentBgIndex, setCurrentBgIndex] = useState(0);
  const [unlockedTools, setUnlockedTools] = useState(['slap', 'hand', 'spawnEnemy', 'spawnGoliath']);
  const [unlockedSkins, setUnlockedSkins] = useState(['default']);
  const [activeSkinId, setActiveSkinId] = useState('default');
  const [customBg, setCustomBg] = useState(null);
  const fileInputRef = useRef(null);
  
  // Audio Refs
  const hammerSoundRef = useRef(null);
  const electrocuteSoundRef = useRef(null);
  const bombSoundRef = useRef(null);
  const slapSoundRef = useRef(null);
  const genericHitSoundRef = useRef(null);

  // Tweak Values
  const gravityScale = tweaks.gravityScale.useState();
  const stiffness = tweaks.stiffness.useState();
  const slowMoFactor = tweaks.slowMoFactor.useState();
  const particleCount = tweaks.particleCount.useState();
  const wallColor = tweaks.wallColor.useState();
  const performanceMode = tweaks.performanceMode.useState();
  const maxBodies = tweaks.maxBodies.useState();
  const constraintIterations = tweaks.constraintIterations.useState();

  // Mutable Game Data
  const particlesRef = useRef([]);
  const mouseRef = useRef(null);
  const mouseConstraintRef = useRef(null);
  const ragdollPartsRef = useRef([]);
  const ragdollConstraintsRef = useRef([]);
  const allRagdollsRef = useRef([]);
  const lightningBoltsRef = useRef([]);
  const skeletonEffectRef = useRef({ active: false, opacity: 0 });
  const slapEffectRef = useRef({ active: false, position: {x:0, y:0}, angle: 0, opacity: 0 });
  const hitCountRef = useRef(0);
  const pleaThresholdRef = useRef(Math.floor(Math.random() * 3) + 3);
  const [mercyPlea, setMercyPlea] = useState({ text: '', position: null, opacity: 0 });

  const dumbbellImageRef = useRef(null);
  const activeRocketsRef = useRef([]);
  const lastRocketLaunchRef = useRef(0);

  // --- Audio Setup ---
  useEffect(() => {
    const hammerAudio = new Audio('https://content.gizmo.party/34e069b5-4beb-40d2-a05e-c99437676f96');
    hammerAudio.preload = 'auto';
    hammerSoundRef.current = hammerAudio;

    const electrocuteAudio = new Audio('https://content.gizmo.party/eaf00bd8-3ffb-4812-ae9c-a0f6f999fdeb');
    electrocuteAudio.preload = 'auto';
    electrocuteSoundRef.current = electrocuteAudio;

    const bombAudio = new Audio('https://content.gizmo.party/076a713f-a32e-411b-95f4-55a1bf2707df');
    bombAudio.preload = 'auto';
    bombSoundRef.current = bombAudio;

    const slapAudio = new Audio('https://content.gizmo.party/62a7ac19-4a34-4360-be79-989e00274219');
    slapAudio.preload = 'auto';
    slapSoundRef.current = slapAudio;

    const genericHitAudio = new Audio('https://content.gizmo.party/34e069b5-4beb-40d2-a05e-c99437676f96');
    genericHitAudio.preload = 'auto';
    genericHitSoundRef.current = genericHitAudio;

    return () => {
      hammerSoundRef.current?.pause();
      electrocuteSoundRef.current?.pause();
      bombSoundRef.current?.pause();
      slapSoundRef.current?.pause();
      genericHitSoundRef.current?.pause();
    };
  }, []);

  const playHammerSound = () => {
    if (hammerSoundRef.current) {
      hammerSoundRef.current.currentTime = 0;
      hammerSoundRef.current.play().catch(() => {});
    }
  };

  const playElectrocuteSound = (intensity = 1) => {
    if (electrocuteSoundRef.current) {
      electrocuteSoundRef.current.volume = Math.min(1, intensity);
      electrocuteSoundRef.current.currentTime = 0;
      electrocuteSoundRef.current.play().catch(() => {});
    }
  };

  const playBombSound = () => {
    if (bombSoundRef.current) {
      bombSoundRef.current.currentTime = 0;
      bombSoundRef.current.play().catch(() => {});
    }
  };

  const playSlapSound = () => {
    if (slapSoundRef.current) {
      slapSoundRef.current.currentTime = 0;
      slapSoundRef.current.play().catch(() => {});
    }
  };

  const playGenericHitSound = () => {
    if (genericHitSoundRef.current) {
      genericHitSoundRef.current.currentTime = 0;
      genericHitSoundRef.current.play().catch(() => {});
    }
  };

  // --- Physics Setup ---
  useEffect(() => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      dumbbellImageRef.current = img;
    };
    img.src = 'https://content.gizmo.party/2fe48780-c37e-415f-99eb-1ffd19ca901e';

    const { Engine, Runner, World, Bodies, Composite, Mouse, MouseConstraint, Events, Body, Vector } = Matter;

    const engine = Engine.create();
    engineRef.current = engine;
    engine.world.gravity.y = gravityScale;
    engine.constraintIterations = constraintIterations;
    engine.positionIterations = performanceMode ? 2 : 6;
    engine.velocityIterations = performanceMode ? 2 : 4;

    const runner = Runner.create();
    runnerRef.current = runner;

    const canvas = canvasRef.current;
    const width = window.innerWidth;
    const height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
    const backgroundImages = [
      'https://content.gizmo.party/475fad2b-58da-47eb-8534-9dade6bf067a',
      'https://content.gizmo.party/0afaaf86-c29b-43ab-a4fb-9120f379a40c',
      'https://content.gizmo.party/2ff7b8a4-e86a-40f7-b575-68fb6dbdf374'
    ];

    const setBackground = (index) => {
        if (customBg) {
          canvas.style.backgroundImage = `url('${customBg}')`;
        } else {
          canvas.style.backgroundImage = `url('${backgroundImages[index]}')`;
        }
    }

    setBackground(currentBgIndex);
    canvas.style.backgroundSize = 'cover';
    canvas.style.backgroundPosition = 'center';
    canvas.style.backgroundRepeat = 'no-repeat';
    const ctx = canvas.getContext('2d');

    const wallOptions = { 
      isStatic: true, 
      render: { fillStyle: wallColor },
      collisionFilter: { category: CATEGORY_WALL }
    };
    const ground = Bodies.rectangle(width / 2, height + 50, width, 100, wallOptions);
    const leftWall = Bodies.rectangle(-50, height / 2, 100, height * 2, wallOptions);
    const rightWall = Bodies.rectangle(width + 50, height / 2, 100, height * 2, wallOptions);
    const ceiling = Bodies.rectangle(width / 2, -500, width, 100, wallOptions);

    World.add(engine.world, [ground, leftWall, rightWall, ceiling]);

    const mouse = Mouse.create(canvas);
    mouseRef.current = mouse;
    const mouseConstraint = MouseConstraint.create(engine, {
      mouse: mouse,
      constraint: {
        stiffness: 0.2,
        render: { visible: false }
      }
    });
    mouseConstraintRef.current = mouseConstraint;
    World.add(engine.world, mouseConstraint);

    mouse.element.removeEventListener("mousewheel", mouse.mousewheel);
    mouse.element.removeEventListener("DOMMouseScroll", mouse.mousewheel);

    Events.on(engine, 'beforeUpdate', () => {
      const targetHead = ragdollPartsRef.current.find(p => p.label === 'Circle Body' && !p.isEnemy);
      if (!targetHead) return;

      activeRocketsRef.current.forEach(rocketData => {
        const rocket = rocketData.body;
        const target = targetHead;
        const dx = target.position.x - rocket.position.x;
        const dy = target.position.y - rocket.position.y;
        const distance = Math.sqrt(dx * dx + dy * dy);
        if (distance < 10) return;
        const desiredAngle = Math.atan2(dy, dx);
        Body.setAngle(rocket, desiredAngle);
        const currentVelocity = rocket.velocity;
        const currentSpeed = Math.sqrt(currentVelocity.x * currentVelocity.x + currentVelocity.y * currentVelocity.y);
        const targetDirection = Vector.normalise({ x: dx, y: dy });
        const desiredVelocity = Vector.mult(targetDirection, currentSpeed);
        const steeringFactor = 0.05;
        const newVelocity = {
          x: currentVelocity.x + (desiredVelocity.x - currentVelocity.x) * steeringFactor,
          y: currentVelocity.y + (desiredVelocity.y - currentVelocity.y) * steeringFactor
        };
        const finalVelocity = Vector.mult(Vector.normalise(newVelocity), Math.max(15, Math.min(25, currentSpeed)));
        Body.setVelocity(rocket, finalVelocity);
      });
    });

    const createRagdoll = (x, y, isEnemy = false, scale = 1) => {
      const category = isEnemy ? CATEGORY_ENEMY : CATEGORY_RAGDOLL;
      const activeSkin = RAGDOLL_SKINS.find(s => s.id === activeSkinId) || RAGDOLL_SKINS[0];
      const color = isEnemy ? '#E93323' : activeSkin.color;
      const headColor = isEnemy ? '#F58F87' : activeSkin.headColor;

      const headOptions = { friction: 0.5, frictionAir: 0.05, render: { fillStyle: headColor }, collisionFilter: { category, mask: CATEGORY_WALL | CATEGORY_PROP | CATEGORY_RAGDOLL | CATEGORY_ENEMY } };
      const chestOptions = { friction: 0.5, frictionAir: 0.05, render: { fillStyle: color }, collisionFilter: { category, mask: CATEGORY_WALL | CATEGORY_PROP | CATEGORY_RAGDOLL | CATEGORY_ENEMY } };
      const limbOptions = { friction: 0.5, frictionAir: 0.03, render: { fillStyle: color }, collisionFilter: { category, mask: CATEGORY_WALL | CATEGORY_PROP | CATEGORY_RAGDOLL | CATEGORY_ENEMY } };

      const head = Bodies.circle(x, y - 70 * scale, 25 * scale, headOptions);
      head.isEnemy = isEnemy;
      if (!isEnemy) head.skinFace = activeSkin.face;
      const torso = Bodies.rectangle(x, y, 40 * scale, 80 * scale, chestOptions);
      const leftUpperArm = Bodies.rectangle(x - 35 * scale, y - 20 * scale, 20 * scale, 50 * scale, limbOptions);
      const leftLowerArm = Bodies.rectangle(x - 35 * scale, y + 35 * scale, 15 * scale, 50 * scale, limbOptions);
      const rightUpperArm = Bodies.rectangle(x + 35 * scale, y - 20 * scale, 20 * scale, 50 * scale, limbOptions);
      const rightLowerArm = Bodies.rectangle(x + 35 * scale, y + 35 * scale, 15 * scale, 50 * scale, limbOptions);
      const leftUpperLeg = Bodies.rectangle(x - 15 * scale, y + 60 * scale, 20 * scale, 60 * scale, limbOptions);
      const leftLowerLeg = Bodies.rectangle(x - 15 * scale, y + 125 * scale, 15 * scale, 60 * scale, limbOptions);
      const rightUpperLeg = Bodies.rectangle(x + 15 * scale, y + 60 * scale, 20 * scale, 60 * scale, limbOptions);
      const rightLowerLeg = Bodies.rectangle(x + 15 * scale, y + 125 * scale, 15 * scale, 60 * scale, limbOptions);

      const parts = [head, torso, leftUpperArm, leftLowerArm, rightUpperArm, rightLowerArm, leftUpperLeg, leftLowerLeg, rightUpperLeg, rightLowerLeg];
      if (!isEnemy) ragdollPartsRef.current = parts;

      const jointOptions = { stiffness: stiffness, render: { visible: false }, label: 'ragdoll-joint' };
      const neck = Matter.Constraint.create({ bodyA: head, bodyB: torso, pointA: { x: 0, y: 25 * scale }, pointB: { x: 0, y: -40 * scale }, length: 2 * scale, ...jointOptions });
      const leftShoulder = Matter.Constraint.create({ bodyA: torso, bodyB: leftUpperArm, pointA: { x: -20 * scale, y: -30 * scale }, pointB: { x: 0, y: -20 * scale }, length: 2 * scale, ...jointOptions });
      const leftElbow = Matter.Constraint.create({ bodyA: leftUpperArm, bodyB: leftLowerArm, pointA: { x: 0, y: 25 * scale }, pointB: { x: 0, y: -25 * scale }, length: 2 * scale, ...jointOptions });
      const rightShoulder = Matter.Constraint.create({ bodyA: torso, bodyB: rightUpperArm, pointA: { x: 20 * scale, y: -30 * scale }, pointB: { x: 0, y: -20 * scale }, length: 2 * scale, ...jointOptions });
      const rightElbow = Matter.Constraint.create({ bodyA: rightUpperArm, bodyB: rightLowerArm, pointA: { x: 0, y: 25 * scale }, pointB: { x: 0, y: -25 * scale }, length: 2 * scale, ...jointOptions });
      const leftHip = Matter.Constraint.create({ bodyA: torso, bodyB: leftUpperLeg, pointA: { x: -10 * scale, y: 40 * scale }, pointB: { x: 0, y: -30 * scale }, length: 2 * scale, ...jointOptions });
      const leftKnee = Matter.Constraint.create({ bodyA: leftUpperLeg, bodyB: leftLowerLeg, pointA: { x: 0, y: 30 * scale }, pointB: { x: 0, y: -30 * scale }, length: 2 * scale, ...jointOptions });
      const rightHip = Matter.Constraint.create({ bodyA: torso, bodyB: rightUpperLeg, pointA: { x: 10 * scale, y: 40 * scale }, pointB: { x: 0, y: -30 * scale }, length: 2 * scale, ...jointOptions });
      const rightKnee = Matter.Constraint.create({ bodyA: rightUpperLeg, bodyB: rightLowerLeg, pointA: { x: 0, y: 30 * scale }, pointB: { x: 0, y: -30 * scale }, length: 2 * scale, ...jointOptions });

      const constraints = [neck, leftShoulder, leftElbow, rightShoulder, rightElbow, leftHip, leftKnee, rightHip, rightKnee];
      if (!isEnemy) ragdollConstraintsRef.current = constraints;

      const ragdollComposite = Composite.create({ bodies: parts, constraints: constraints });
      allRagdollsRef.current.push(ragdollComposite);
      World.add(engine.world, ragdollComposite);
      return ragdollComposite;
    };

    createRagdoll(width / 2, height / 3, false);

    const render = () => {
      let bodies = Composite.allBodies(engine.world);
      if (performanceMode && bodies.length > maxBodies) {
        bodies = bodies.filter(b => b.collisionFilter.category === CATEGORY_WALL || b.position.y < height + 200);
      }
      ctx.clearRect(0, 0, width, height);

      bodies.forEach(body => {
        if (body.render.visible === false) return;
        if (performanceMode && body.position.y > height + 500) return;
        const isRagdollPart = ragdollPartsRef.current.includes(body);
        const showSkeleton = skeletonEffectRef.current.active && (isRagdollPart || body.isEnemy);
        
        if (body.render.sprite && body.render.sprite.texture) {
          ctx.save();
          ctx.translate(body.position.x, body.position.y);
          ctx.rotate(body.angle);
          const texture = body.render.sprite.texture;
          const w = body.bounds.max.x - body.bounds.min.x;
          const h = body.bounds.max.y - body.bounds.min.y;
          if (texture === '🚀' || texture === '🔨') {
            ctx.font = `${w * 1.5}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(texture, 0, 0);
          } else if (dumbbellImageRef.current) {
            ctx.drawImage(dumbbellImageRef.current, -w / 2, -h / 2, w, h);
          }
          ctx.restore();
          return;
        }

        ctx.beginPath();
        const vertices = body.vertices;
        ctx.moveTo(vertices[0].x, vertices[0].y);
        for (let j = 1; j < vertices.length; j += 1) ctx.lineTo(vertices[j].x, vertices[j].y);
        ctx.lineTo(vertices[0].x, vertices[0].y);
        
        if (showSkeleton) {
          ctx.globalAlpha = skeletonEffectRef.current.opacity;
          ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
          ctx.fill();
          ctx.strokeStyle = '#000';
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.save();
          ctx.translate(body.position.x, body.position.y);
          ctx.rotate(body.angle);
          ctx.strokeStyle = '#333';
          ctx.lineWidth = 3;
          const w = body.bounds.max.x - body.bounds.min.x;
          const h = body.bounds.max.y - body.bounds.min.y;
          if (body.label === 'Circle Body') {
            ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI * 2); ctx.stroke();
            ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(-8, -5, 4, 0, Math.PI * 2); ctx.arc(8, -5, 4, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.moveTo(-10, 10); ctx.lineTo(10, 10); ctx.stroke();
          } else if (h > 70 && w < 50) {
            ctx.beginPath(); ctx.moveTo(0, -h/2 + 10); ctx.lineTo(0, h/2 - 10); ctx.stroke();
            for(let i = -20; i <= 20; i += 10) { ctx.beginPath(); ctx.moveTo(-w/2 + 5, i); ctx.lineTo(w/2 - 5, i); ctx.stroke(); }
          } else if (h > w) {
            ctx.beginPath(); ctx.arc(0, -h/2 + 5, 5, 0, Math.PI * 2); ctx.arc(0, h/2 - 5, 5, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.moveTo(0, -h/2 + 5); ctx.lineTo(0, h/2 - 5); ctx.stroke();
          } else {
            ctx.beginPath(); ctx.moveTo(-w/4, 0); ctx.lineTo(w/4, 0); ctx.stroke();
          }
          ctx.restore();
          ctx.globalAlpha = 1;
        } else {
          ctx.fillStyle = body.render.fillStyle || '#fff';
          ctx.fill();
          ctx.strokeStyle = '#000';
          ctx.lineWidth = 2;
          ctx.stroke();
          if (body.label === 'Circle Body' && body.area < 3000 && body.position.y < height - 50) {
             ctx.save();
             ctx.translate(body.position.x, body.position.y);
             ctx.rotate(body.angle);
             ctx.font = body.isEnemy && body.circleRadius > 30 ? `${body.circleRadius * 2}px sans-serif` : '50px sans-serif';
             ctx.textAlign = 'center';
             ctx.textBaseline = 'middle';
             const activeSkin = RAGDOLL_SKINS.find(s => s.id === activeSkinId) || RAGDOLL_SKINS[0];
             const faceEmoji = body.isEnemy ? (body.circleRadius > 30 * (tweaks.goliathSize.value / 2.5) ? '🗿' : '😡') : (body.skinFace || activeSkin.face);
             ctx.textBaseline = 'middle';
             ctx.fillText(faceEmoji, 0, 2);
             ctx.restore();
