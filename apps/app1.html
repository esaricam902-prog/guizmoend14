<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Simulator Pro</title>

  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel pour interpréter le React/JS -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function YoutubeSimulator() {
      const [subscribers, setSubscribers] = useState(0);
      const [money, setMoney] = useState(0);
      const [views, setViews] = useState(0);

      // Équipements
      const [cameraLevel, setCameraLevel] = useState(1);
      const [micLevel, setMicLevel] = useState(1);
      const [editorLevel, setEditorLevel] = useState(1);

      // Statistiques de la vidéo
      const [isRecording, setIsRecording] = useState(false);
      const [progress, setProgress] = useState(0);

      // Prix de base
      const cameraCost = Math.floor(50 * Math.pow(1.5, cameraLevel));
      const micCost = Math.floor(30 * Math.pow(1.4, micLevel));
      const editorCost = Math.floor(100 * Math.pow(1.6, editorLevel));

      // Créer une vidéo
      const makeVideo = () => {
        if (isRecording) return;
        setIsRecording(true);
        setProgress(0);

        const interval = setInterval(() => {
          setProgress((prev) => {
            if (prev >= 100) {
              clearInterval(interval);
              setIsRecording(false);

              // Calcul des gains
              const newViews = Math.floor((Math.random() * 50 + 10) * cameraLevel * micLevel);
              const newSubs = Math.floor(newViews * 0.1 * editorLevel);
              const newMoney = Math.floor(newViews * 0.05 * editorLevel);

              setViews((v) => v + newViews);
              setSubscribers((s) => s + newSubs);
              setMoney((m) => m + newMoney);

              return 0;
            }
            return prev + 20;
          });
        }, 200);
      };

      // Améliorations
      const buyCamera = () => {
        if (money >= cameraCost) {
          setMoney(money - cameraCost);
          setCameraLevel(cameraLevel + 1);
        }
      };

      const buyMic = () => {
        if (money >= micCost) {
          setMoney(money - micCost);
          setMicLevel(micLevel + 1);
        }
      };

      const buyEditor = () => {
        if (money >= editorCost) {
          setMoney(money - editorCost);
          setEditorLevel(editorLevel + 1);
        }
      };

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      return (
        <div className="max-w-4xl mx-auto p-6 space-y-6">
          {/* Header */}
          <header className="flex justify-between items-center bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl">
            <div>
              <h1 className="text-3xl font-extrabold text-red-500 flex items-center gap-2">
                <i data-lucide="youtube"></i> YouTube Simulator Pro
              </h1>
              <p className="text-slate-400 text-sm mt-1">Deviens le plus grand créateur de contenu !</p>
            </div>
            <div className="flex gap-6 text-right">
              <div>
                <div className="text-xs text-slate-400 uppercase font-bold">Abonnés</div>
                <div className="text-2xl font-bold text-red-400">{subscribers.toLocaleString()}</div>
              </div>
              <div>
                <div className="text-xs text-slate-400 uppercase font-bold">Vues</div>
                <div className="text-2xl font-bold text-blue-400">{views.toLocaleString()}</div>
              </div>
              <div>
                <div className="text-xs text-slate-400 uppercase font-bold">Argent</div>
                <div className="text-2xl font-bold text-green-400">{money.toLocaleString()} €</div>
              </div>
            </div>
          </header>

          {/* Section Studio & Enregistrement */}
          <main className="grid md:grid-cols-2 gap-6">
            <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800 flex flex-col justify-between items-center text-center">
              <h2 className="text-xl font-bold text-slate-200 flex items-center gap-2">
                <i data-lucide="video"></i> Studio d'enregistrement
              </h2>

              <div className="my-8 w-full">
                {isRecording ? (
                  <div className="space-y-3">
                    <div className="text-sm font-semibold text-red-400 animate-pulse">
                      🎬 Tournage & Montage en cours... {progress}%
                    </div>
                    <div className="w-full bg-slate-800 h-4 rounded-full overflow-hidden">
                      <div
                        className="bg-red-600 h-full transition-all duration-200"
                        style={{ width: `${progress}%` }}
                      ></div>
                    </div>
                  </div>
                ) : (
                  <button
                    onClick={makeVideo}
                    className="w-full py-8 bg-red-600 hover:bg-red-700 text-white text-xl font-bold rounded-2xl shadow-lg transition active:scale-95 flex flex-col items-center justify-center gap-2"
                  >
                    <i data-lucide="play-circle" className="w-12 h-12"></i>
                    Créer une vidéo
                  </button>
                )}
              </div>

              <div className="text-xs text-slate-500">
                Plus ton matériel est bon, plus tu gagnes de vues et d'abonnés par vidéo !
              </div>
            </div>

            {/* Boutique / Upgrades */}
            <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-4">
              <h2 className="text-xl font-bold text-slate-200 flex items-center gap-2">
                <i data-lucide="shopping-bag"></i> Améliorations Matériel
              </h2>

              {/* Caméra */}
              <div className="flex justify-between items-center bg-slate-800/50 p-4 rounded-xl border border-slate-700/50">
                <div>
                  <div className="font-semibold text-slate-200">📷 Caméra (Niv. {cameraLevel})</div>
                  <div className="text-xs text-slate-400">Boost les vues potentielles</div>
                </div>
                <button
                  onClick={buyCamera}
                  disabled={money < cameraCost}
                  className={`px-4 py-2 rounded-xl font-bold text-sm ${
                    money >= cameraCost
                      ? 'bg-green-600 hover:bg-green-500 text-white'
                      : 'bg-slate-800 text-slate-500 cursor-not-allowed'
                  }`}
                >
                  {cameraCost} €
                </button>
              </div>

              {/* Micro */}
              <div className="flex justify-between items-center bg-slate-800/50 p-4 rounded-xl border border-slate-700/50">
                <div>
                  <div className="font-semibold text-slate-200">🎙️ Micro (Niv. {micLevel})</div>
                  <div className="text-xs text-slate-400">Qualité du son accrue</div>
                </div>
                <button
                  onClick={buyMic}
                  disabled={money < micCost}
                  className={`px-4 py-2 rounded-xl font-bold text-sm ${
                    money >= micCost
                      ? 'bg-green-600 hover:bg-green-500 text-white'
                      : 'bg-slate-800 text-slate-500 cursor-not-allowed'
                  }`}
                >
                  {micCost} €
                </button>
              </div>

              {/* Logiciel de Montage */}
              <div className="flex justify-between items-center bg-slate-800/50 p-4 rounded-xl border border-slate-700/50">
                <div>
                  <div className="font-semibold text-slate-200">💻 Logiciel Montage (Niv. {editorLevel})</div>
                  <div className="text-xs text-slate-400">Multiplie les abonnés et le cash</div>
                </div>
                <button
                  onClick={buyEditor}
                  disabled={money < editorCost}
                  className={`px-4 py-2 rounded-xl font-bold text-sm ${
                    money >= editorCost
                      ? 'bg-green-600 hover:bg-green-500 text-white'
                      : 'bg-slate-800 text-slate-500 cursor-not-allowed'
                  }`}
                >
                  {editorCost} €
                </button>
              </div>
            </div>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<YoutubeSimulator />);
  </script>
</body>
</html>
