      <div className="fixed top-24 left-0 right-0 pointer-events-none flex flex-col items-center gap-3 z-[60]">
        {notifications.map(n => (
          <div key={n.id} className="bg-white text-black px-6 py-3 rounded-2xl font-black text-[11px] shadow-[0_20px_40px_rgba(0,0,0,0.4)] animate-in slide-in-from-top-4 fade-in duration-300 uppercase tracking-widest border border-white/20">
            {n.text}
          </div>
        ))}
      </div>

      {/* Admin Login Modal */}
      {showAdminLogin && (
        <div className="fixed inset-0 bg-black/95 z-[150] flex flex-col p-6 animate-in fade-in duration-500 backdrop-blur-xl">
          <button onClick={() => { setShowAdminLogin(false); setLoginPass(''); setLoginError(''); }} className="self-start p-3 text-gray-500 mb-6 bg-white/5 rounded-2xl border border-white/10 active:scale-95 transition-all">
            <ChevronLeft size={32} />
          </button>
          <div className="flex-1 flex flex-col justify-center items-center space-y-8 px-4">
            <div className="text-center space-y-4 w-full">
              <div className="bg-white/5 w-24 h-24 rounded-[2.5rem] flex items-center justify-center mx-auto mb-6 border border-white/10 shadow-2xl">
                <Lock size={40} className="text-white" />
              </div>
              <h2 className="text-3xl font-black text-white tracking-tighter uppercase">{translate('Authorization')}</h2>
              <p className="text-gray-600 text-[9px] font-black tracking-[0.3em] uppercase">{translate('Enter 4-Digit Security Key')}</p>
            </div>
            <div className="space-y-6 w-full max-w-xs">
              <div className="flex justify-center gap-3">
                {[0, 1, 2, 3].map((i) => (
                  <div key={i} className="w-14 h-14 bg-white/5 border-2 border-white/10 rounded-2xl flex items-center justify-center text-2xl font-black text-white">
                    {loginPass[i] ? '●' : ''}
                  </div>
                ))}
              </div>
              <div className="grid grid-cols-3 gap-3">
                {[1, 2, 3, 4, 5, 6, 7, 8, 9].map((num) => (
                  <button
                    key={num}
                    onClick={() => {
                      if (loginPass.length < 4) {
                        const newPass = loginPass + num;
                        setLoginPass(newPass);
                        gizmoRuntime.performHaptic('light');
                        if (newPass === '2524') {
                          setIsAdmin(true);
                          setShowAdminLogin(false);
                          setActiveTab('admin');
                          setLoginError('');
                          setLoginPass('');
                          gizmoRuntime.performHaptic('heavy');
                          addNotification('🔓 Admin Access Granted');
                        } else if (newPass.length === 4) {
                          setLoginError('Invalid credentials');
                          gizmoRuntime.performHaptic('rigid');
                        }
                      }
                    }}
                    className="bg-white/10 hover:bg-white/20 border border-white/10 rounded-2xl py-4 font-black text-lg text-white active:scale-95 transition-all"
                  >
                    {num}
                  </button>
                ))}
                <button
                  onClick={() => {
                    if (loginPass.length > 0) {
                      setLoginPass(loginPass.slice(0, -1));
                      gizmoRuntime.performHaptic('light');
                    }
                  }}
                  className="col-span-3 bg-white/10 hover:bg-white/20 border border-white/10 rounded-2xl py-4 font-black text-sm text-white active:scale-95 transition-all uppercase tracking-widest"
                >
                  Backspace
                </button>
              </div>
              {loginError && <p className="text-red-500 text-[11px] font-black text-center uppercase tracking-widest animate-bounce">{loginError}</p>}
              <button 
                onClick={handleLogin} 
                className="w-full bg-red-600 hover:bg-red-700 py-5 rounded-[2rem] font-black text-sm active:scale-95 transition-all uppercase tracking-[0.3em] shadow-[0_20px_40px_rgba(220,38,38,0.3)] disabled:opacity-50 disabled:cursor-not-allowed border border-red-500/50" 
                disabled={loginPass.length !== 4}
              >
                {translate(adminLoginBtn)}
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Reply Modal */}
      {selectedCommentIndex !== null && (
        <div className="fixed inset-0 bg-black/80 z-[200] flex items-end justify-center p-6 animate-in fade-in duration-300 backdrop-blur-sm">
          <div className="w-full max-w-md bg-[#121212] rounded-[2.5rem] p-8 border border-white/10 shadow-2xl animate-in slide-in-from-bottom-10 duration-500">
            <div className="flex justify-between items-center mb-6">
              <h3 className="text-white font-black uppercase tracking-widest text-xs">{translate('Reply to')} {recentComments[selectedCommentIndex]?.user}</h3>
              <button onClick={() => setSelectedCommentIndex(null)} className="text-gray-500"><Plus className="rotate-45" /></button>
            </div>

            {!replyMode ? (
              <div className="grid grid-cols-2 gap-4">
                <button 
                  onClick={() => { setReplyMode('video'); gizmoRuntime.performHaptic('medium'); }}
                  className="bg-red-600 p-6 rounded-[2rem] flex flex-col items-center gap-3 active:scale-95 transition-all"
                >
                  <Camera className="text-white" size={24} />
                  <span className="text-white font-black text-[10px] uppercase tracking-widest">{translate('Reply by Video')}</span>
                </button>
                <button 
                  onClick={() => { setReplyMode('text'); gizmoRuntime.performHaptic('medium'); }}
                  className="bg-white/5 p-6 rounded-[2rem] border border-white/10 flex flex-col items-center gap-3 active:scale-95 transition-all"
                >
                  <MessageSquare className="text-white" size={24} />
                  <span className="text-white font-black text-[10px] uppercase tracking-widest">{translate('Reply by Text')}</span>
                </button>
              </div>
            ) : replyMode === 'video' ? (
              <div className="space-y-6 text-center">
                <div className="aspect-video bg-black rounded-3xl flex items-center justify-center border border-white/5 relative overflow-hidden">
                  <div className="absolute inset-0 bg-red-600/10 animate-pulse" />
                  <Play className="text-red-600 fill-red-600" size={48} />
                </div>
                <textarea 
                  autoFocus
                  value={replyText}
                  onChange={(e) => setReplyText(e.target.value)}
                  placeholder="Ce que tu dis dans la vidéo..."
                  className="w-full bg-black/40 border border-white/10 rounded-2xl p-4 text-white text-sm focus:outline-none h-24 resize-none"
                />
                <div className="flex gap-4">
                  <button onClick={() => setReplyMode(null)} className="flex-1 bg-white/5 py-4 rounded-2xl text-gray-400 font-black text-[10px] uppercase tracking-widest">{translate('Cancel')}</button>
                  <button onClick={handleReplySubmit} className="flex-1 bg-red-600 py-4 rounded-2xl text-white font-black text-[10px] uppercase tracking-widest">{translate('Send Reply')}</button>
                </div>
              </div>
            ) : (
              <div className="space-y-4">
                <textarea 
                  autoFocus
                  value={replyText}
                  onChange={(e) => setReplyText(e.target.value)}
                  placeholder={translate('Type your reply...')}
                  className="w-full bg-black/40 border border-white/10 rounded-2xl p-4 text-white text-sm focus:outline-none h-32 resize-none"
                />
                <div className="flex gap-4">
                  <button onClick={() => setReplyMode(null)} className="flex-1 bg-white/5 py-4 rounded-2xl text-gray-400 font-black text-[10px] uppercase tracking-widest">{translate('Cancel')}</button>
                  <button onClick={handleReplySubmit} className="flex-1 bg-red-600 py-4 rounded-2xl text-white font-black text-[10px] uppercase tracking-widest">{translate('Send Reply')}</button>
                </div>
              </div>
            )}
          </div>
        </div>
      )}

      {/* Navigation */}
      <div className="fixed bottom-0 left-0 right-0 h-24 bg-[#080808]/95 backdrop-blur-3xl border-t border-white/5 flex items-center justify-around px-4 z-50 pb-6">
        {[
          { id: 'home', icon: <Home size={22} />, label: 'Home' },
          { id: 'upgrades', icon: <Zap size={22} />, label: 'Shop' },
          { id: 'trends', icon: <Flame size={22} />, label: 'Trends' },
          { id: 'leaderboard', icon: <Trophy size={22} />, label: 'Ranks' },
          { id: 'you', icon: <User size={22} />, label: 'Profile' }
        ].map((tab) => (
          <button
            key={tab.id}
            onClick={() => { setActiveTab(tab.id); gizmoRuntime.performHaptic('light'); }}
            className={`flex flex-col items-center justify-center w-16 h-16 rounded-2xl transition-all relative ${
              activeTab === tab.id ? 'text-white' : 'text-gray-600'
            }`}
          >
            {activeTab === tab.id && (
              <div className="absolute inset-0 bg-white/5 rounded-2xl animate-in zoom-in duration-200" />
            )}
            <div className={`transition-transform duration-300 ${activeTab === tab.id ? 'scale-110 -translate-y-1' : ''}`}>
              {tab.icon}
            </div>
            <span className={`text-[8px] mt-1.5 font-black uppercase tracking-widest transition-opacity ${activeTab === tab.id ? 'opacity-100' : 'opacity-60'}`}>
              {translate(tab.label)}
            </span>
            {activeTab === tab.id && (
              <div className="absolute -bottom-1 w-1 h-1 bg-red-600 rounded-full shadow-[0_0_8px_rgba(220,38,38,1)]" />
            )}
          </button>
        ))}
      </div>
    </div>
  );
}
